<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>架空世界地図ペインター</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #141418;
      color: #e5e7eb;
    }
    header {
      padding: 12px 20px;
      background: #1e1e24;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #2d2d3a;
      z-index: 10;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .palette {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }
    .color-swatch.active {
      border-color: #fff;
      transform: scale(1.15);
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }
    
    .viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      background: #0d0d11;
      position: relative;
    }
    #mapCanvas {
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      cursor: pointer;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    #statusBadge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #222;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<header>
  <div class="controls">
    <label style="font-size: 13px; font-weight: 500;">色選択:</label>
    <input type="color" id="customColor" value="#e63946" style="cursor: pointer; border: none; background: none; width: 32px; height: 32px;">
    
    <div class="palette" id="presetPalette">
      <!-- プリセット色 -->
      <div class="color-swatch active" style="background: #e63946;" data-color="#e63946"></div>
      <div class="color-swatch" style="background: #457b9d;" data-color="#457b9d"></div>
      <div class="color-swatch" style="background: #2a9d8f;" data-color="#2a9d8f"></div>
      <div class="color-swatch" style="background: #e9c46a;" data-color="#e9c46a"></div>
      <div class="color-swatch" style="background: #f4a261;" data-color="#f4a261"></div>
      <div class="color-swatch" style="background: #8338ec;" data-color="#8338ec"></div>
    </div>
  </div>

  <div class="controls">
    <span id="hoverInfo" style="font-size: 13px; font-weight: 600; min-width: 140px; color: #60a5fa;"></span>
    <button class="btn btn-secondary" id="clearBtn">色クリア</button>
    <button class="btn" id="exportBtn">高画質PNG保存 (2000×4000)</button>
    <span id="statusBadge">アセット読込中...</span>
  </div>
</header>

<div class="viewport">
  <canvas id="mapCanvas" width="2000" height="4000"></canvas>
</div>

<script>
const CONFIG = {
  baseImage: './assets/base.png',
  overlayImage: './assets/overlay.png',
  countries: [
    { id: 'NovaOccidentia', name: 'Nova Occidentia', src: './assets/countries/country_NovaOccidentia.png' },
    { id: 'NovaNordica',    name: 'Nova Nordica',    src: './assets/countries/country_NovaNordica.png' },
    { id: 'NovaOrkia',      name: 'Nova Orkia',      src: './assets/countries/country_NovaOrkia.png' }
  ]
};

const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const statusBadge = document.getElementById('statusBadge');
const hoverInfo = document.getElementById('hoverInfo');
const customColor = document.getElementById('customColor');

let activeColor = '#e63946';
let baseImg = null;
let overlayImg = null;

const state = {
  countryColors: {}, // { [id]: '#hex' }
  masks: {}          // { [id]: { img, hitCtx } }
};

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Failed to load ${src}`));
    img.src = src;
  });
}

async function init() {
  try {
    statusBadge.innerText = "アセット読み込み中...";
    baseImg = await loadImage(CONFIG.baseImage);
    overlayImg = await loadImage(CONFIG.overlayImage);

    for (const c of CONFIG.countries) {
      const img = await loadImage(c.src);
      const hitCanvas = document.createElement('canvas');
      hitCanvas.width = 2000;
      hitCanvas.height = 4000;
      const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });
      hitCtx.drawImage(img, 0, 0);

      state.masks[c.id] = { img, hitCtx };
    }

    statusBadge.innerText = "準備完了";
    statusBadge.style.color = "#4ade80";
    render();
  } catch (err) {
    statusBadge.innerText = "画像読込エラー";
    statusBadge.style.color = "#f87171";
    console.error(err);
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. 下層：背景地図
  if (baseImg) ctx.drawImage(baseImg, 0, 0);

  // 2. 中層：着色領域
  for (const c of CONFIG.countries) {
    const color = state.countryColors[c.id];
    if (color && state.masks[c.id]) {
      const mask = state.masks[c.id].img;
      const tCanvas = document.createElement('canvas');
      tCanvas.width = canvas.width;
      tCanvas.height = canvas.height;
      const tCtx = tCanvas.getContext('2d');

      tCtx.drawImage(mask, 0, 0);
      tCtx.globalCompositeOperation = 'source-in';
      tCtx.fillStyle = color;
      tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);

      ctx.drawImage(tCanvas, 0, 0);
    }
  }

  // 3. 上層：海岸線・国境線
  if (overlayImg) ctx.drawImage(overlayImg, 0, 0);
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.floor((e.clientX - rect.left) * scaleX),
    y: Math.floor((e.clientY - rect.top) * scaleY)
  };
}

function getHitCountry(x, y) {
  if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return null;
  for (let i = CONFIG.countries.length - 1; i >= 0; i--) {
    const c = CONFIG.countries[i];
    const mask = state.masks[c.id];
    if (!mask) continue;
    const pixel = mask.hitCtx.getImageData(x, y, 1, 1).data;
    if (pixel[3] > 0) return c;
  }
  return null;
}

// クリック判定
canvas.addEventListener('click', (e) => {
  const { x, y } = getCanvasCoords(e);
  const target = getHitCountry(x, y);

  if (target) {
    if (state.countryColors[target.id] === activeColor) {
      delete state.countryColors[target.id];
    } else {
      state.countryColors[target.id] = activeColor;
    }
    render();
  }
});

// ホバー時国名表示
canvas.addEventListener('mousemove', (e) => {
  const { x, y } = getCanvasCoords(e);
  const target = getHitCountry(x, y);
  hoverInfo.innerText = target ? target.name : '';
});

// パレット選択
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    activeColor = swatch.dataset.color;
    customColor.value = activeColor;
  });
});

customColor.addEventListener('input', (e) => {
  activeColor = e.target.value;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
});

// 色クリア
document.getElementById('clearBtn').addEventListener('click', () => {
  state.countryColors = {};
  render();
});

// 2000×4000 原寸PNGエクスポート
document.getElementById('exportBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `world_map_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

init();
</script>
</body>
</html>
